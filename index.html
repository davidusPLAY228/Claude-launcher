<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; img-src 'self'">
  <title>Claude Launcher</title>
  <link rel="icon" href="manifest.ico" type="image/x-icon">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle">
      <img src="./assets/icon-menu.svg" alt="☰">
    </button>
    <div class="sidebar-items">
      <button class="sidebar-item" id="sb-omniroute" title="Запуск OmniRoute">
        <img src="./assets/icon-omniroute.svg" alt="" id="sb-omniroute-icon">
        <span class="sidebar-label" id="sb-omniroute-label">Запуск OmniRoute</span>
      </button>
      <button class="sidebar-item" id="sb-stop-claude" title="Остановить все процессы Claude">
        <img src="./assets/icon-stop-claude.svg" alt="">
        <span class="sidebar-label">Остановить claude</span>
      </button>
      <button class="sidebar-item" id="sb-nvm" title="Установка nvm">
        <img src="./assets/icon-nvm.svg" alt="">
        <span class="sidebar-label">Установка nvm</span>
      </button>
    </div>
  </div>
  <div class="app-content">
    <div class="header">
      <img src="manifest.ico" width="36" height="36" alt="">
      <h1>Claude Launcher</h1>
      <span>v1.1.0</span>
    </div>

    <!-- ============ SETTINGS ============ -->
    <div id="view-settings" class="view active">

    <!-- Dependency status panel -->
    <div class="dep-panel">
      <div class="dep-panel-title">Зависимости</div>
      <div class="dep-row" id="dep-node">
        <span class="dep-dot loading"></span>
        <span class="dep-name">Node.js</span>
        <span class="dep-ver">проверка...</span>
      </div>
      <div class="dep-warn-msg" id="dep-node-warn" style="display:none"></div>
      <div class="dep-row" id="dep-omniroute">
        <span class="dep-dot loading"></span>
        <span class="dep-name">OmniRoute</span>
        <span class="dep-ver">проверка...</span>
      </div>
      <div class="dep-row" id="dep-claude">
        <span class="dep-dot loading"></span>
        <span class="dep-name">Claude Code</span>
        <span class="dep-ver">проверка...</span>
      </div>
    </div>

    <div class="field">
      <label>Адрес API</label>
      <input type="text" id="inp-api-url" placeholder="http://localhost:20129">
    </div>

    <div class="field">
      <label>Auth Token</label>
      <div class="token-wrapper">
        <input type="password" id="inp-token" placeholder="sk-0...">
        <button class="token-toggle" id="btn-eye" title="Показать/скрыть">👁</button>
      </div>
    </div>

    <div class="field">
      <label>Model</label>
      <select id="sel-model"></select>
    </div>

    <div class="field custom-model-field" id="custom-field">
      <label>Custom model name</label>
      <input type="text" id="inp-custom-model" placeholder="provider/model-name">
    </div>

    <div class="field">
      <label>Рабочая папка</label>
      <div class="folder-row">
        <input type="text" id="inp-dir" placeholder="C:\\Users\\...\\project" readonly>
        <button id="btn-browse">Обзор</button>
      </div>
    </div>

    <div class="field">
      <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
        <input type="checkbox" id="chk-resume">
        <span>Запустить в предыдущем чате</span>
      </label>
    </div>

    <div style="display: flex; gap: 8px; margin-top: auto;">
      <button class="btn-return" id="btn-return" style="display: none;">Вернуться</button>
      <button class="launch-btn" id="btn-launch">Запустить</button>
    </div>
  </div>

  <!-- ============ LOGS ============ -->
  <div id="view-logs" class="view">
    <div class="log-list" id="log-list"></div>
    <div id="log-summary" style="display:none"></div>
    <div class="log-actions">
      <button class="btn-back" id="btn-back">← Назад</button>
      <button class="btn-abort" id="btn-abort">Прервать</button>
      <button class="btn-stop" id="btn-stop" style="display:none">Stop</button>
      <button class="btn-retry" id="btn-retry" disabled>Повторить</button>
    </div>
  </div>
  </div>
</div>

<script src="renderer.js"></script>
</body>
</html>
